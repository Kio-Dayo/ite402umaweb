<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMAcards</title>

<link rel="stylesheet" href="/style.css">

</head>

<body>
<header>
  <div class="logo">UMA<span>cards</span></div>
  <nav id="nav"></nav>
  <button id="themeBtn" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle light/dark mode">🌙</button>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. SETTINGS  (edit this section)
   ========================================================= */
const API = window.location.origin || "http://localhost:3000";   // use the same Express server that served this page

const TYPE_ORDER = ["Speed", "Stamina", "Power", "Guts", "Wit", "Friend", "Group"];
const RARITIES = ["SSR", "SR", "R"];
const ICON = { Speed: "⚡", Stamina: "💧", Power: "💪", Guts: "🔥", Wit: "🧠", Friend: "🤝", Group: "👥", Unknown: "❔" };

// The API's type names -> the names used on the cards
const TYPE_NAMES = { speed: "Speed", stamina: "Stamina", power: "Power", guts: "Guts",
  wit: "Wit", intelligence: "Wit", int: "Wit", friend: "Friend", group: "Group" };

// If your API returns a different field for the card art, add it to this list
const CARD_IMAGE_FIELDS = ["image", "image_url", "art_url"];

/* =========================================================
   2. STATE
   ========================================================= */
let CARDS = [];   // { id, name, char, type, rarity, image }
let CHARS = [];   // { id, name, image }
let TYPES = [];

const TABS = [["chars", "Characters"], ["cards", "Support Cards"], ["builds", "Builds"], ["saved", "Saved Builds"]];
const $ = id => document.getElementById(id);
const byId = id => CARDS.find(c => c.id === id);
const tone = c => `t-${c.type} r-${c.rarity}`;
const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

let page = "cards";
let filters = { char: "", type: "", rarity: "" };
let slots = Array(6).fill(null);   // card ids picked for the current build
let buildName = "";
let buildChar = "";
let pickingSlot = 0;
let loading = true;
let loadError = "";
let saved = [];
try { saved = JSON.parse(localStorage.getItem("uma_builds_v2") || "[]"); } catch (e) {}

/* =========================================================
   3. LOAD DATA FROM YOUR SERVER
   ========================================================= */
function firstImage(list) {
  if (typeof list === "string") return list;
  if (Array.isArray(list)) {
    for (const item of list) {
      const image = firstImage(item);
      if (image) return image;
    }
    return "";
  }
  if (!list || typeof list !== "object") return "";
  const directImage = list.image || list.url || list.src || list.image_url || list.path;
  return directImage || firstImage(list.images);
}
function normType(t) {
  return TYPE_NAMES[String(t || "").toLowerCase()] || (t ? String(t) : "Unknown");
}
function normRarity(c) {
  if (c.rarityString) return String(c.rarityString).toUpperCase();
  return { 1: "R", 2: "SR", 3: "SSR" }[c.rarity] || "R";
}

async function loadData() {
  loading = true; loadError = ""; render();
  try {
    const [charRes, cardRes] = await Promise.all([fetch(`${API}/characters`), fetch(`${API}/supportcards`)]);
    if (!charRes.ok) throw new Error(`/characters returned status ${charRes.status}`);
    if (!cardRes.ok) throw new Error(`/supportcards returned status ${cardRes.status}`);
    const charJson = await charRes.json();
    const cardJson = await cardRes.json();

    CHARS = charJson.data
      .map(c => ({ id: c.id, name: c.name_en || "Unknown", image: firstImage(c.images) }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const nameById = new Map(CHARS.map(c => [c.id, c.name]));

    CARDS = cardJson.data.map(c => ({
      id: c.id,
      name: c.name_en,
      char: nameById.get(c.chara_id) || "Unknown",
      type: normType(c.type),
      rarity: normRarity(c),
      image: CARD_IMAGE_FIELDS.map(f => c[f]).find(Boolean) || "",
    }));

    TYPES = [...new Set(CARDS.map(c => c.type))]
      .sort((a, b) => (TYPE_ORDER.indexOf(a) + 99) % 99 - (TYPE_ORDER.indexOf(b) + 99) % 99);
  } catch (e) {
    console.error(e);
    loadError = `Couldn't load data (${e.message}). Server expected at ${API}. Check the terminal running "node app.js" for errors.`;
  }
  loading = false;
  render();
}

/* =========================================================
   4. SMALL HELPERS
   ========================================================= */
function persist() {
  try { localStorage.setItem("uma_builds_v2", JSON.stringify(saved)); } catch (e) {}
}
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}
function go(p) { page = p; render(); }
function options(list, selected, label) {
  return `<option value="">${label}</option>` +
    list.map(v => `<option ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
}
function hue(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
/* Images: blank (just the colored background) when there is none */
function imgTag(src, alt) {
  return src ? `<img class="pt" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : "";
}
function charImg(name) { return imgTag((CHARS.find(c => c.name === name) || {}).image, name); }
function cardImg(c)    { return imgTag(c.image, c.name); }

/* =========================================================
   5. HTML BUILDERS
   ========================================================= */
function artHTML(c) {
  return `<div class="art"><i class="ic">${ICON[c.type] || ICON.Unknown}</i><span class="rb">${c.rarity}</span>${cardImg(c)}</div>`;
}

function cardHTML(c, pickable) {
  return `<div class="card frame ${tone(c)} ${pickable ? "pick" : ""}" style="--d:${(c.id % 12) * 40}ms"
      ${pickable ? `onclick="pickCard(${c.id})"` : ""}>
    ${artHTML(c)}
    <div class="info">
      <b>${esc(c.name)}</b>
      <span class="muted">${esc(c.char)}</span>
      <span class="ty">${ICON[c.type] || ICON.Unknown} ${esc(c.type)}</span>
    </div>
  </div>`;
}

function slotHTML(id, i) {
  const c = id === null ? null : byId(id);
  if (!c) {
    return `<div class="slot" onclick="openPicker(${i})"><span class="muted">+ Pick card ${i + 1}</span></div>`;
  }
  return `<div class="slot frame ${tone(c)}" onclick="openPicker(${i})">
    <span class="x" onclick="event.stopPropagation(); slots[${i}] = null; render()">×</span>
    ${artHTML(c)}
    <div class="info"><b>${esc(c.char)}</b><span class="ty">${ICON[c.type] || ICON.Unknown} ${esc(c.type)}</span></div>
  </div>`;
}

function miniHTML(c) {
  return `<div class="frame ${tone(c)}">
    <div class="art">${cardImg(c)}</div>
    <div class="info"><b>${esc(c.char)}</b><span class="ty">${ICON[c.type] || ICON.Unknown} ${esc(c.type)} · ${c.rarity}</span></div>
  </div>`;
}

function filteredCards() {
  return CARDS.filter(c =>
    (!filters.char || c.char === filters.char) &&
    (!filters.type || c.type === filters.type) &&
    (!filters.rarity || c.rarity === filters.rarity));
}

function listHTML(pickable) {
  const list = filteredCards();
  return list.length
    ? `<div class="grid">${list.map(c => cardHTML(c, pickable)).join("")}</div>`
    : `<div class="empty">No cards match these filters.</div>`;
}

function filterBarHTML(onChange) {
  const names = CHARS.map(c => c.name);
  return `<div class="filters">
    <select onchange="filters.char = this.value; ${onChange}">${options(names, filters.char, "All Characters")}</select>
    <select onchange="filters.type = this.value; ${onChange}">${options(TYPES, filters.type, "All Types")}</select>
    <select onchange="filters.rarity = this.value; ${onChange}">${options(RARITIES, filters.rarity, "All Rarities")}</select>
  </div>`;
}

/* =========================================================
   6. PAGES
   ========================================================= */
function renderNav() {
  $("nav").innerHTML = TABS.map(([key, label]) =>
    `<button class="${key === page ? "on" : ""}" onclick="go('${key}')">${label}</button>`).join("");
}

function charactersPage() {
  return `<h2>Characters</h2><div class="grid">${CHARS.map((ch, i) => `
    <div class="card frame pick" style="--tc:hsl(${hue(ch.name)} 55% 50%)" onclick="showCharacter(${i})">
      <div class="art">${imgTag(ch.image, ch.name)}</div>
      <div class="info"><b>${esc(ch.name)}</b>
        <span class="muted">${CARDS.filter(c => c.char === ch.name).length} card(s)</span></div>
    </div>`).join("")}</div>`;
}

function cardsPage() {
  return `<h2>Support Cards</h2>
    ${filterBarHTML("refreshList()")}
    <div id="list">${listHTML(false)}</div>`;
}

function buildsPage() {
  return `<h2>Builds</h2>
  <div class="build">
    <div>
      <div class="panel" style="margin-bottom:12px">
        <div class="art build-preview">
          ${buildChar ? charImg(buildChar) : '<span class="preview-prompt">Choose a character to preview</span>'}
        </div>
        <select style="width:100%" onchange="buildChar = this.value; render()">
          ${options(CHARS.map(c => c.name), buildChar, "Pick character")}
        </select>
      </div>
    </div>
    <div>
      <div class="slots">${slots.map(slotHTML).join("")}</div>
      <div class="row">
        <input placeholder="Build name" value="${esc(buildName)}" oninput="buildName = this.value">
        <button class="btn" onclick="saveBuild()">Save Build</button>
        <button class="btn alt" onclick="clearBuild()">Clear</button>
      </div>
    </div>
  </div>`;
}

function savedPage() {
  if (!saved.length) {
    return `<h2>Saved Builds</h2><div class="empty">No saved builds yet. Make one in the Builds tab.</div>`;
  }
  return `<h2>Saved Builds</h2>` + saved.map((b, i) => `
    <div class="saved">
      <h3>
        <span>${esc(b.name)}${b.char ? ` <span class="muted" style="font-weight:400">— ${esc(b.char)}</span>` : ""}</span>
        <span>
          <button class="btn alt" onclick="loadBuild(${i})">Load</button>
          <button class="btn alt" onclick="deleteBuild(${i})">Delete</button>
        </span>
      </h3>
      <div class="mini">${b.cards.map(byId).filter(Boolean).map(miniHTML).join("")}</div>
    </div>`).join("");
}

function render() {
  renderNav();
  if (loading) { $("app").innerHTML = `<div class="status">Loading cards… the first load can take a little while.</div>`; return; }
  if (loadError) {
    $("app").innerHTML = `<div class="status">${esc(loadError)}<br><br><button class="btn" onclick="loadData()">Try again</button></div>`;
    return;
  }
  const pages = { chars: charactersPage, cards: cardsPage, builds: buildsPage, saved: savedPage };
  $("app").innerHTML = pages[page]();
}

/* =========================================================
   7. ACTIONS
   ========================================================= */
function refreshList() { const el = $("list"); if (el) el.innerHTML = listHTML(false); }
function showCharacter(i) { filters = { char: CHARS[i].name, type: "", rarity: "" }; go("cards"); }

function openPicker(slotIndex) {
  pickingSlot = slotIndex;
  $("dlg").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Pick a support card</b>
      <button class="btn alt" onclick="$('dlg').close()">Close</button>
    </div>
    <div style="margin-top:12px">${filterBarHTML("refreshPicker()")}</div>
    <div id="plist" style="overflow:auto;max-height:55vh">${listHTML(true)}</div>`;
  $("dlg").showModal();
}
function refreshPicker() { $("plist").innerHTML = listHTML(true); }

function pickCard(id) {
  if (slots.some((s, i) => s === id && i !== pickingSlot)) { toast("Card already in this build"); return; }
  slots[pickingSlot] = id;
  $("dlg").close();
  render();
}

function clearBuild() { slots = Array(6).fill(null); buildName = ""; buildChar = ""; render(); }

function saveBuild() {
  if (slots.some(s => s === null)) { toast("Pick all 6 cards first"); return; }
  saved.push({ name: buildName.trim() || `Build ${saved.length + 1}`, char: buildChar, cards: [...slots] });
  persist();
  clearBuild();
  toast("Build saved!");
  go("saved");
}
function loadBuild(i) {
  const b = saved[i];
  slots = b.cards.map(id => (byId(id) ? id : null));
  buildName = b.name; buildChar = b.char || "";
  go("builds");
}
function deleteBuild(i) { saved.splice(i, 1); persist(); render(); }

/* =========================================================
   8. LIGHT / DARK MODE
   ========================================================= */
function currentTheme() {
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const t = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("uma_theme", t); } catch (e) {}
}

/* =========================================================
   9. START
   ========================================================= */
let savedTheme = null;
try { savedTheme = localStorage.getItem("uma_theme"); } catch (e) {}
applyTheme(savedTheme || currentTheme());
loadData();
</script>
</body>
</html>
